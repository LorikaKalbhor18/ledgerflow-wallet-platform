spring:
  application:
    name: ledgerflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ledgerflow}
    username: ${DB_USERNAME:ledgerflow}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:ledgerflow_local}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
